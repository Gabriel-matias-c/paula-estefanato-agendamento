<!DOCTYPE html>
<html class="scroll-smooth" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Painel • Paula Estefanato</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            theme: { extend: {
                colors: {
                  primary: "#442a22", "primary-container": "#5d4037", surface: "#faf9f8",
                  "surface-container-low": "#f4f3f2", "surface-container-lowest": "#ffffff",
                  "on-surface": "#1a1c1c", "on-surface-variant": "#504441", "on-primary": "#ffffff",
                  "outline-variant": "#d4c3be",
                  tertiary: "#735c00", "tertiary-container": "#cba72f", error: "#ba1a1a"
                },
                fontFamily: {
                  "headline-lg": ["Playfair Display"], "headline-lg-mobile": ["Playfair Display"],
                  "label-sm": ["Inter"], "body-md": ["Inter"]
                },
                fontSize: {
                  "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "500"}],
                  "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "500"}],
                  "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                  "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                },
                spacing: { "margin-mobile": "16px" }
            } }
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        .spinner {
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            width: 16px; height: 16px;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-surface-container-low text-on-surface overflow-x-hidden font-body-md">
<div class="max-w-[480px] mx-auto bg-surface min-h-screen relative shadow-xl flex flex-col justify-center px-margin-mobile">

  <div class="mb-10 text-center">
    <span class="material-symbols-outlined text-primary text-3xl mb-3 inline-block" data-icon="spa">spa</span>
    <h1 class="text-headline-lg-mobile font-headline-lg-mobile text-primary text-2xl mb-1">Paula Estefanato</h1>
    <p class="text-[11px] text-on-surface-variant uppercase tracking-[0.25em]">Painel de Agendamentos</p>
  </div>

  <form id="loginForm" class="space-y-4">
    <div>
      <label class="text-[11px] text-on-surface-variant uppercase tracking-widest block mb-2">E-mail</label>
      <input required id="email" type="email" autocomplete="username" class="w-full px-4 py-3 rounded-xl border border-outline-variant/40 bg-surface-container-lowest text-body-md focus:outline-none focus:border-tertiary-container" />
    </div>
    <div>
      <label class="text-[11px] text-on-surface-variant uppercase tracking-widest block mb-2">Senha</label>
      <input required id="password" type="password" autocomplete="current-password" class="w-full px-4 py-3 rounded-xl border border-outline-variant/40 bg-surface-container-lowest text-body-md focus:outline-none focus:border-tertiary-container" />
    </div>
    <p id="errorMsg" class="hidden text-error text-sm"></p>
    <button type="submit" id="loginBtn" class="w-full bg-primary-container text-on-primary py-4 rounded-full text-label-sm uppercase tracking-[0.2em] shadow-sm hover:shadow-md active:scale-95 transition-all flex items-center justify-center gap-2">
      Entrar
    </button>
  </form>

  <a href="/index.html" class="text-[11px] text-on-surface-variant text-center mt-10 uppercase tracking-widest">Voltar ao site</a>
</div>

<script src="/js/supabase-config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);

// Se já estiver logada, pula direto pro painel
const { data: { session } } = await supabase.auth.getSession();
if (session) window.location.href = '/admin/dashboard.html';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = `<div class="spinner"></div> Entrando...`;

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    errorMsg.textContent = 'E-mail ou senha incorretos.';
    errorMsg.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }
  window.location.href = '/admin/dashboard.html';
});
</script>
</body></html>
